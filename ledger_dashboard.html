<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEO — Trade Learning Ledger</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141a24; --panel2:#1b2330; --line:#263243;
    --text:#e6edf3; --muted:#8b97a7; --green:#3fb950; --red:#f85149;
    --accent:#58a6ff; --amber:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px;}
  h1{font-size:20px;margin:0;font-weight:650}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  header{display:flex;justify-content:space-between;align-items:center;
         flex-wrap:wrap;gap:12px;margin-bottom:18px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
         border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .card .value{font-size:26px;font-weight:700;margin-top:6px}
  .grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:18px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
            margin:0 0 12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .pill.long{background:rgba(63,185,80,.15);color:var(--green)}
  .pill.short{background:rgba(248,81,73,.15);color:var(--red)}
  .pill.live{background:rgba(210,153,34,.15);color:var(--amber)}
  .pill.paper{background:rgba(88,166,255,.15);color:var(--accent)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .chartwrap{overflow:hidden}
  .foot{color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div>
    <h1>🧠 Trade Learning Ledger</h1>
    <div class="sub">Every closed trade the bot has made — the data it learns from. Auto-refreshes every 15s.</div>
  </div>
  <button id="refresh">↻ Refresh</button>
</header>

<div id="app"><div class="empty">Loading…</div></div>
<div class="foot" id="foot"></div>

<script>
const $ = s => document.querySelector(s);
const fmt = (n,d=2)=> (n==null||isNaN(n)) ? "—" : Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const cls = n => n>0 ? "pos" : n<0 ? "neg" : "";
const sign = n => (n>0?"+":"") + fmt(n);

function sparkline(series){
  if(!series || series.length<2) return '<div class="empty">Not enough closed trades yet to chart.</div>';
  const w=760, h=180, pad=8;
  const ys=series.map(p=>p.cum_pnl);
  const min=Math.min(...ys,0), max=Math.max(...ys,0);
  const span=(max-min)||1;
  const X=i=> pad + i*(w-2*pad)/(series.length-1);
  const Y=v=> h-pad - (v-min)*(h-2*pad)/span;
  let d="";
  series.forEach((p,i)=> d += (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.cum_pnl).toFixed(1)+" ");
  const zeroY=Y(0).toFixed(1);
  const last=ys[ys.length-1];
  const stroke = last>=0 ? "var(--green)" : "var(--red)";
  return `<div class="chartwrap"><svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="max-height:200px">
    <line x1="0" y1="${zeroY}" x2="${w}" y2="${zeroY}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2"/>
  </svg></div>`;
}

function tableRows(rows, cols){
  if(!rows||!rows.length) return '<tr><td class="empty" colspan="'+cols.length+'">No data</td></tr>';
  return rows.map(r=>"<tr>"+cols.map(c=>c.render(r)).join("")+"</tr>").join("");
}

function render(d){
  const t=d.totals||{};
  if(!t.trades){
    $("#app").innerHTML='<div class="panel"><div class="empty">No trades recorded yet.<br>The ledger fills as the bot closes positions.</div></div>';
    return;
  }
  const cards=`<div class="cards">
    <div class="card"><div class="label">Closed Trades</div><div class="value">${t.trades}</div></div>
    <div class="card"><div class="label">Win Rate</div><div class="value">${fmt(t.win_rate,1)}%</div></div>
    <div class="card"><div class="label">Total PnL</div><div class="value ${cls(t.total_pnl)}">${sign(t.total_pnl)}</div></div>
    <div class="card"><div class="label">Avg PnL / Trade</div><div class="value ${cls(t.avg_pnl)}">${sign(t.avg_pnl)}</div></div>
  </div>`;

  const chart=`<div class="panel"><h2>Cumulative Realized PnL</h2>${sparkline(d.cum_pnl)}</div>`;

  const dirReason=`<div class="panel"><h2>By Direction &amp; Exit Reason</h2>
    <table><thead><tr><th>Direction</th><th class="num">Trades</th><th class="num">Win%</th><th class="num">PnL</th></tr></thead>
    <tbody>${tableRows(d.by_direction,[
      {render:r=>`<td><span class="pill ${r.direction}">${(r.direction||'').toUpperCase()}</span></td>`},
      {render:r=>`<td class="num">${r.trades}</td>`},
      {render:r=>`<td class="num">${fmt(r.win_rate,1)}</td>`},
      {render:r=>`<td class="num ${cls(r.total_pnl)}">${sign(r.total_pnl)}</td>`}])}</tbody></table>
    <table style="margin-top:14px"><thead><tr><th>Exit Reason</th><th class="num">Trades</th><th class="num">Win%</th><th class="num">PnL</th></tr></thead>
    <tbody>${tableRows(d.by_reason,[
      {render:r=>`<td>${r.reason||'—'}</td>`},
      {render:r=>`<td class="num">${r.trades}</td>`},
      {render:r=>`<td class="num">${fmt(r.win_rate,1)}</td>`},
      {render:r=>`<td class="num ${cls(r.total_pnl)}">${sign(r.total_pnl)}</td>`}])}</tbody></table>
  </div>`;

  const bySym=`<div class="panel"><h2>By Symbol</h2>
    <table><thead><tr><th>Symbol</th><th class="num">Trades</th><th class="num">Win%</th><th class="num">PnL</th></tr></thead>
    <tbody>${tableRows(d.by_symbol,[
      {render:r=>`<td>${r.symbol}</td>`},
      {render:r=>`<td class="num">${r.trades}</td>`},
      {render:r=>`<td class="num">${fmt(r.win_rate,1)}</td>`},
      {render:r=>`<td class="num ${cls(r.total_pnl)}">${sign(r.total_pnl)}</td>`}])}</tbody></table></div>`;

  const recent=`<div class="panel"><h2>Recent Trades</h2>
    <div style="overflow-x:auto"><table><thead><tr>
      <th>Time (UTC)</th><th>Symbol</th><th>Dir</th><th>Mode</th>
      <th class="num">Entry</th><th class="num">Exit</th><th class="num">PnL</th>
      <th class="num">Conf</th><th class="num">Score</th><th>Reason</th></tr></thead>
    <tbody>${tableRows(d.recent,[
      {render:r=>`<td>${(r.ts||'').replace('T',' ').slice(0,19)}</td>`},
      {render:r=>`<td>${r.symbol}</td>`},
      {render:r=>`<td><span class="pill ${r.direction}">${(r.direction||'').toUpperCase()}</span></td>`},
      {render:r=>`<td><span class="pill ${r.mode}">${r.mode||''}</span></td>`},
      {render:r=>`<td class="num">${fmt(r.entry_price)}</td>`},
      {render:r=>`<td class="num">${fmt(r.exit_price)}</td>`},
      {render:r=>`<td class="num ${cls(r.pnl)}">${sign(r.pnl)}</td>`},
      {render:r=>`<td class="num">${r.entry_conf==null?'—':fmt(r.entry_conf*100,0)+'%'}</td>`},
      {render:r=>`<td class="num">${r.composite==null?'—':fmt(r.composite,0)}</td>`},
      {render:r=>`<td>${r.reason||''}</td>`}])}</tbody></table></div></div>`;

  $("#app").innerHTML = cards + chart + `<div class="grid2">${dirReason}${bySym}</div>` + recent;
}

async function load(){
  try{
    const res = await fetch('/api/ledger/stats?recent=30',{cache:'no-store'});
    const d = await res.json();
    render(d);
    $("#foot").textContent = "Updated " + new Date().toLocaleTimeString();
  }catch(e){
    $("#app").innerHTML='<div class="panel"><div class="empty">Could not load ledger: '+e+'</div></div>';
  }
}
$("#refresh").addEventListener('click', load);
load();
setInterval(load, 15000);
</script>
</body>
</html>

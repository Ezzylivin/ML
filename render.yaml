# File: render.yaml
services:
  - type: web
    name: trading-ml-backend # A more descriptive name
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # ✅ FIX: Use the correct startup command for FastAPI/Uvicorn
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET # Example for a secret key
        sync: false
